name: Sync GitCode mirror

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    paths:
      - 'kit/tools/sync_gitcode.py'
      - 'kit/tools/test_sync_gitcode.py'
      - '.github/workflows/sync-gitcode.yml'
  workflow_run:
    workflows: ['Publish Chinese Store source']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 kit/tools/test_sync_gitcode.py

  refs:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gitcode-refs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror Git branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY }}
          GITCODE_USERNAME: ${{ vars.GITCODE_USERNAME }}
          GITCODE_HOST: ${{ vars.GITCODE_HOST || 'gitcode.com' }}
        run: python3 kit/tools/sync_gitcode.py --refs-only

  releases:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: gitcode-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror published releases and verify the HTTPS catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY }}
          GITCODE_USERNAME: ${{ vars.GITCODE_USERNAME }}
          GITCODE_HOST: ${{ vars.GITCODE_HOST || 'gitcode.com' }}
        run: python3 kit/tools/sync_gitcode.py
